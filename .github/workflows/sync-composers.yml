name: Sync Classical Composers (OpenOpus)

on:
  # Runs automatically every day at 03:00 UTC to incrementally grow the database
  schedule:
    - cron: "0 3 * * *"
  # Also lets you trigger a sync anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new composers to import in this run"
        required: false
        default: "15"
      max_works_per_composer:
        description: "Max works to import per composer"
        required: false
        default: "35"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync next batch of composers & works into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '15' }}
          MAX_WORKS_PER_COMPOSER: ${{ github.event.inputs.max_works_per_composer || '35' }}
        run: node scripts/sync-openopus.mjs
