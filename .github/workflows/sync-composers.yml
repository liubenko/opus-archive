name: Sync Classical Composers (OpenOpus + MusicBrainz + Metadata)

on:
  # Runs automatically every day at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"
  # Manual trigger with configurable source & batch sizes
  workflow_dispatch:
    inputs:
      source:
        description: "Which pipeline step to run"
        type: choice
        default: "all"
        options:
          - all
          - enrich
          - imslp
          - musicbrainz
          - openopus
      batch_size:
        description: "Items per run (composers for sync / works for enrich)"
        required: false
        default: "40"
      max_works_per_composer:
        description: "Max works per composer (for OpenOpus / MusicBrainz)"
        required: false
        default: "40"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync composers & works from OpenOpus + Wikipedia
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'openopus' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
          MAX_WORKS_PER_COMPOSER: ${{ github.event.inputs.max_works_per_composer || '40' }}
        run: node scripts/sync-openopus.mjs

      - name: Enrich & sync composers & works from MusicBrainz
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'musicbrainz' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MB_BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
          MB_MAX_WORKS: ${{ github.event.inputs.max_works_per_composer || '40' }}
        run: node scripts/sync-musicbrainz.mjs

      - name: Enrich missing work metadata (Wikipedia + Wikidata + MusicBrainz)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'enrich' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ENRICH_BATCH_SIZE: ${{ github.event.inputs.batch_size || '60' }}
        run: node scripts/enrich-works.mjs

      - name: Link IMSLP sheet music scores (IMSLP MediaWiki API)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'imslp' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IMSLP_BATCH_SIZE: ${{ github.event.inputs.batch_size || '30' }}
        run: node scripts/sync-imslp.mjs
